[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhole"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.1",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=7.0.0",
    "ddgs>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.vercel]
entrypoint = "run:app"
