[project]
name = "blackhole"
version = "1.0.0"
description = "BlackHole Flask Search & AI Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "api*"]
